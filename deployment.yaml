apiVersion: apps/v1
kind: Deployment

metadata:
  name: devOps_assessment9_1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devOps_assessment9_1

  template:
    metadata:
      labels:
        app: devOps_assessment9_1

    spec:
      containers:
        - name: devOps_assessment9_1
          image: shivam3294/devOps_assessment9_1:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: devOps_assessment9_1-service

spec:
  type: NodePort

  selector:
    app: devOps_assessment9_1

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assessment9-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-assessment9-1
  template:
    metadata:
      labels:
        app: devops-assessment9-1
    spec:
      containers:
        - name: devops-assessment9-1
          image: shivam3294/devops-assessment9-1:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-assessment9-1-service
spec:
  type: NodePort
  selector:
    app: devops-assessment9-1
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
